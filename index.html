<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vinylast Inc. — family-owned vinyl railing and fencing supplier for contractors since 1974. Contact us at customerservice@vinylast.com or (732) 367-7200."
    />
    <title>Vinylast Inc. — Vinyl Railing &amp; Fencing</title>
    <link rel="icon" href="images/vinylast-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"

    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <div class="page">
      <main class="hero">
        <img
          class="logo"
          src="images/vinylast-logo.png"
          alt="Vinylast Inc."
          width="2001"
          height="651"
        />

        <p class="blurb">
          Vinylast is a family-owned and operated business proudly supplying
          contractors with all their vinyl railing and fencing needs since 1974.
        </p>

        <nav class="contacts" aria-label="Contact">
          <a class="contact" href="mailto:customerservice@vinylast.com">
            <svg
              class="contact-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <path d="m3 7 9 6 9-6" />
            </svg>
            <span>customerservice@vinylast.com</span>
          </a>
          <a class="contact" href="tel:+17323677200">
            <svg
              class="contact-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M6.6 3.8c.4-.4 1-.5 1.5-.3l2.3 1c.5.2.8.7.8 1.3v2.2c0 .4-.2.8-.5 1-.8.6-1.2 1.5-1 2.4.4 1.8 1.8 3.2 3.6 3.6.9.2 1.8-.2 2.4-1 .2-.3.6-.5 1-.5h2.2c.6 0 1.1.3 1.3.8l1 2.3c.2.5.1 1.1-.3 1.5l-1.1 1.1c-.4.4-1 .6-1.5.5-4.2-.5-8.1-2.8-10.8-5.5S4.9 8.8 4.4 4.6c-.1-.5.1-1.1.5-1.5l1.7-1.3z"
              />
            </svg>
            <span>(732) 367-7200</span>
          </a>
        </nav>
      </main>

      <footer class="footer">
        <p>&copy; <span id="year"></span> Vinylast Inc.</p>
      </footer>
    </div>

    <script src="main.js"></script>
  </body>
</html>
